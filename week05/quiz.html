<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>  
    <header>
        <h1>Basic HTML and CSS quiz</h1>
    </header>
    <main>
            <form>
                <label for="q1">1.What does the acronym CSS stand for?</label>
                <input type="text" id="q1" name="q1" required>


                <label for="q2">2.How are ID and class attributes selected in CSS?</label>
                <textarea id="q2" name="q2" required placeholder="Write your answer here..."></textarea>


                <label for="q3">3.Which HTML element is used to create a hyperlink?</label>
                <select type="text" id="q3" name="q3" required>
                    <option value="" selected disabled>Choose an option</option>
                    <option value="a">a</option>
                    <option value="p">p</option>
                    <option value="div">div</option></select>
                
                    
                <label for="q4">4.Which CSS property is used to change the background color?</label>
                <input type="text" id="q4" name="q4" required>

                <button type="submit">Submit Quiz</button>
            </form>
    </main>    
    
    
</body>
</html>
