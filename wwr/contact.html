<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | White Water Rafting</title>
    <meta name="description"
      content=" Contact the White Water Rafting team for information about our rafting trips, services, locations, and adventure packages.">
    <meta name="author" content="Moroni Balarezo">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.jpg" alt="logo">
        <nav>

            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>

        </nav>
    </header>

    <main>
        <section class="contact-info">

            <h1>White Water Rafting</h1>
            <p>123 Main River Street,</p>
            <p>Anytown, USA</p>
            <p>Phone: +1 (123) 456-7890</p>
            <p>email: info@whitewaterrafting.com</p>
        
        </section>

        <section class="contact-layout">
            <div class="map">

                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d4841.653893918869!2d-77.86361422717731!3d-0.4612315739808659!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x91d6791700511657%3A0xbb5cf3a3fff79888!2sRainforest%20Rafting%20Kayaking%20Ecuador!5e1!3m2!1ses-419!2sec!4v1785786250813!5m2!1ses-419!2sec"  
                width="600" height="450" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
                    
            </div>

            <form> 

                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required> 

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>

                <fieldset>            
                    <legend>Message Purpose</legend>
                    
                    <div class="radio-option">
                        <input type="radio" id="purpose1" name="purpose" value="general">
                        <label for="purpose1">General Inquiry</label>
                    </div>

                    <div class="radio-option"> 
                        <input type="radio" id="purpose2" name="purpose" value="booking">
                        <label for="purpose2">Reservation Question</label>
                    </div>

                    <div class="radio-option">
                        <input type="radio" id="purpose3" name="purpose" value="website">
                        <label for="purpose3">Website Suggestion</label>
                    </div>
                </fieldset>

                    <label for="message">Message:</label>
                    <textarea id="message" name="message" required placeholder="Write your message here..."></textarea>

                <div class="checkbox-option">
                    <input type="checkbox" id="agree" name="agree">
                    <label for="agree">Please Subscribe me to the monthly newsletter</label>          
                </div>

                    <button type="submit">Get in Touch</button>
                
            </form>
        </section>


        <section class="adventures">
            <h2>We Are Here to Serve You</h2>

            <div class="adventure-gallery">

                <figure>
                    <img src="images/instructor1.jpg" alt="General Manager">
                    <figcaption>Juan Perez-General Manager</figcaption>
                </figure>

                <figure>
                    <img src="images/instructor2.jpg" alt="Rafting Guide">
                    <figcaption>Maria Lopez-Rafting Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/instructor3.jpg" alt="Reservations Coordinator">
                    <figcaption>Carlos Sanchez-Reservations Coordinator</figcaption>
                </figure>

            </div>
        </section>


    </main>

    <footer>
        <p>&copy; 2026| White Water Rafting| Moroni Balarezo</p>

        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook Icon">
            </a>

            <a href="https://tiktok.com">
                <img src="images/tiktok.png" alt="Tiktok Icon">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram.png" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
